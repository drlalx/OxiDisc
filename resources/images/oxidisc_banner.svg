<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240">
  <defs>
    <linearGradient id="bannerBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="55%" stop-color="#151922"/>
      <stop offset="100%" stop-color="#0c0e14"/>
    </linearGradient>

    <linearGradient id="bannerBorder1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#2b3140" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="oxiTextGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c61"/>
      <stop offset="50%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#de4c36"/>
    </linearGradient>

    <linearGradient id="discBase1" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#2b303c"/>
      <stop offset="35%" stop-color="#191c24"/>
      <stop offset="50%" stop-color="#343a48"/>
      <stop offset="65%" stop-color="#161920"/>
      <stop offset="100%" stop-color="#292e3a"/>
    </linearGradient>

    <linearGradient id="copperSheen1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b47" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#de4c36" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#9e2a1b" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="cyanSheen1" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.7"/>
      <stop offset="55%" stop-color="#0077b6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="45%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ffbe0b"/>
    </linearGradient>

    <filter id="glowB1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="discClipB1">
      <circle cx="128" cy="128" r="88"/>
    </clipPath>
  </defs>

  <!-- Banner Card Background -->
  <rect x="4" y="4" width="872" height="232" rx="28" fill="url(#bannerBg1)" stroke="url(#bannerBorder1)" stroke-width="2.5"/>

  <!-- Subtle Background Acoustic Wave Lines -->
  <path d="M 260 195 Q 420 155, 560 190 T 860 165" fill="none" stroke="#ff6b35" stroke-width="1.2" stroke-opacity="0.12"/>
  <path d="M 260 205 Q 450 170, 610 200 T 860 185" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.12"/>

  <!-- Embedded Scalable Vector Icon on Left -->
  <g transform="translate(22, 4) scale(0.9)">
    <g clip-path="url(#discClipB1)">
      <circle cx="128" cy="128" r="88" fill="url(#discBase1)"/>
      <path d="M128,128 L35,55 A120,120 0 0,1 105,30 Z" fill="url(#copperSheen1)"/>
      <path d="M128,128 L221,201 A120,120 0 0,1 151,226 Z" fill="url(#copperSheen1)"/>
      <path d="M128,128 L195,40 A120,120 0 0,1 226,105 Z" fill="url(#cyanSheen1)"/>
      <path d="M128,128 L61,216 A120,120 0 0,1 30,151 Z" fill="url(#cyanSheen1)"/>
    </g>
    <circle cx="128" cy="128" r="88" fill="none" stroke="#ff7b47" stroke-width="2.5" stroke-opacity="0.8"/>
    <circle cx="128" cy="128" r="76" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.16" stroke-dasharray="18 6"/>
    <circle cx="128" cy="128" r="64" fill="none" stroke="#ff8c61" stroke-width="0.8" stroke-opacity="0.25"/>
    <circle cx="128" cy="128" r="52" fill="none" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.25"/>
    <circle cx="128" cy="128" r="31" fill="#13161f" stroke="#ff6b35" stroke-width="2"/>
    <circle cx="128" cy="128" r="14" fill="#090a0f" stroke="#8d99ae" stroke-width="1.5"/>

    <g filter="url(#glowB1)">
      <line x1="38" y1="202" x2="94" y2="154" stroke="#00f0ff" stroke-width="3.8" stroke-linecap="round"/>
      <line x1="38" y1="202" x2="94" y2="154" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="94" cy="154" r="5" fill="#00f0ff"/>
      <circle cx="94" cy="154" r="2.5" fill="#ffffff"/>
      <path d="M 94 154 L 106 154 L 114 126 L 124 168 L 136 96 L 148 174 L 162 78 L 174 158 L 186 106 L 198 144 L 208 122 L 220 128"
            fill="none" stroke="url(#waveGrad1)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <circle cx="136" cy="96" r="2.8" fill="#ffffff"/>
    <circle cx="162" cy="78" r="3.2" fill="#ffbe0b"/>
    <circle cx="186" cy="106" r="2.8" fill="#ff6b35"/>
  </g>

  <!-- Typography & Branding -->
  <text x="265" y="102" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="68" font-weight="800" letter-spacing="-1.5">
    <tspan fill="url(#oxiTextGrad1)">Oxi</tspan><tspan fill="#f8f9fa">Disc</tspan>
  </text>

  <!-- Subtitle -->
  <text x="268" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="19" font-weight="500" fill="#adb5bd" letter-spacing="0.4">
    High-Precision Cross-Platform Audio CD Ripper in Rust
  </text>

  <!-- Feature Pills -->
  <g transform="translate(268, 162)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, monospace" font-size="13" font-weight="600">
    <rect x="0" y="0" width="154" height="30" rx="15" fill="#1c2230" stroke="#ff6b35" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="77" y="20" fill="#ff9f68" text-anchor="middle">FLAC • Opus • WAV</text>

    <rect x="168" y="0" width="206" height="30" rx="15" fill="#1c2230" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.5"/>
    <text x="271" y="20" fill="#72efdd" text-anchor="middle">MusicBrainz • AcoustID</text>

    <rect x="388" y="0" width="148" height="30" rx="15" fill="#1c2230" stroke="#8d99ae" stroke-width="1.2" stroke-opacity="0.4"/>
    <text x="462" y="20" fill="#e9ecef" text-anchor="middle">egui GUI &amp; TUI</text>
  </g>
</svg>
