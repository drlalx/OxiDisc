# cargo-deny configuration for OxiDisc
# Checks that all dependencies are properly licensed and compatible with the MIT license.
# Reference: https://embarkstudios.github.io/cargo-deny/

[licenses]
# Fail the build if any crate has no license specified
unlicensed = "deny"

# Fail the build if any crate uses strong copyleft (e.g. GPL / AGPL)
copyleft = "deny"

# Confidence threshold for detecting license files
confidence-threshold = 0.8

# List of allowed licenses compatible with MIT
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]

# Exceptions / clarifications for dual-licensed or complex crates
[[licenses.clarify]]
name = "ring"
expression = "Apache-2.0 AND ISC"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[licenses.private]
# Ignore local workspace packages
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Security vulnerabilities (CVEs / RUSTSEC vulnerability advisories) are strictly denied
vulnerability = "deny"
# Informational advisories
unmaintained = "warn"
yanked = "warn"
notice = "warn"
ignore = [
    # ttf-parser is unmaintained (transitive dependency via epaint/egui)
    "RUSTSEC-2026-0192",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
